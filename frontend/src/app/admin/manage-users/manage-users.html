<div class="container mt-4">

  <h3>Manage Users</h3>

  <!-- 🔍 Search -->
  <input
    class="form-control mb-3"
    placeholder="Search name, email or role"
    [(ngModel)]="searchTerm">

  <!-- 👤 Table -->
  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of paginatedUsers">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="deleteUser(user._id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- ⏮ Pagination -->
  <div class="d-flex justify-content-between">
    <button class="btn btn-secondary btn-sm"
            (click)="page = page - 1"
            [disabled]="page === 1">
      Prev
    </button>

    <button class="btn btn-secondary btn-sm"
            (click)="page = page + 1"
            [disabled]="page * pageSize >= filteredUsers.length">
      Next
    </button>
  </div>

</div>
