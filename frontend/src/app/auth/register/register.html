<div class="container mt-5" style="max-width: 400px">
  <h2>Register</h2>
  <form (ngSubmit)="register()">
    <div class="mb-3">
      <label>Name</label>
      <input [(ngModel)]="name" name="name" class="form-control" required />
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" class="form-control" type="email" required />
    </div>
    <div class="mb-3">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" class="form-control" type="password" required />
    </div>
    <button class="btn btn-success w-100" type="submit">Register</button>
    <p class="mt-3">Already have an account? <a routerLink="/login">Login</a></p>
  </form>
</div>
